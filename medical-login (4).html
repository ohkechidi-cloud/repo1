<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Back Doctor</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary:   #003255;
    --blue1:     #0EA5E9;
    --blue2:     #3CB5EC;
    --blue3:     #CBE9FF;
    --light:     #90D5FF;
    --bg:        #CBE9FF;
  }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    overflow: hidden;
    position: relative;
  }

  /* ── BIG BUBBLES ── */
  .bubble {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .b1 { width: 380px; height: 380px; background: var(--blue2);  top: -120px;  left: -120px; opacity: 0.72; animation: drift1 9s ease-in-out infinite; }
  .b2 { width: 260px; height: 260px; background: var(--light);  top:  50px;   left: -60px;  opacity: 0.65; animation: drift2 11s ease-in-out infinite; }
  .b3 { width: 420px; height: 420px; background: var(--blue1);  bottom:-130px;right:-130px; opacity: 0.5;  animation: drift1 10s 1s ease-in-out infinite; }
  .b4 { width: 220px; height: 220px; background: var(--light);  bottom: 60px; right: 40px;  opacity: 0.68; animation: drift2 8s 0.5s ease-in-out infinite; }
  .b5 { width: 180px; height: 180px; background: var(--blue2);  top:  20px;   right: 50px;  opacity: 0.55; animation: drift1 12s 2s ease-in-out infinite; }
  .b6 { width: 130px; height: 130px; background: var(--blue1);  top:  45%;    left: 3%;     opacity: 0.4;  animation: drift2 7s 1.5s ease-in-out infinite; }
  .b7 { width: 100px; height: 100px; background: var(--light);  bottom: 20%;  left: 12%;    opacity: 0.5;  animation: drift1 9s 3s ease-in-out infinite; }

  @keyframes drift1 {
    0%,100% { transform: translate(0,0); }
    50%      { transform: translate(14px, -18px); }
  }
  @keyframes drift2 {
    0%,100% { transform: translate(0,0); }
    50%      { transform: translate(-12px, 16px); }
  }

  /* ── FLOATING MEDICAL ICONS ── */
  .icon-float {
    position: fixed;
    pointer-events: none;
    z-index: 0;
  }

  /* Big clipboard — left side, prominent */
  .ic-clip {
    width: 200px; top: 50%; left: 3%;
    transform: translateY(-50%);
    opacity: 1;
    filter: drop-shadow(0 16px 32px rgba(0,50,85,0.22));
    animation: iconFloat 6s 1s ease-in-out infinite;
  }

  /* Stethoscope — bottom left */
  .ic-steth {
    width: 130px; bottom: 6%; left: 5%;
    opacity: 0.75;
    filter: drop-shadow(0 6px 16px rgba(0,50,85,0.18));
    animation: iconFloat 7s ease-in-out infinite;
  }

  /* Cross — top right */
  .ic-cross {
    width: 80px; top: 10%; right: 4%;
    opacity: 0.7;
    filter: drop-shadow(0 4px 12px rgba(0,50,85,0.15));
    animation: iconFloat 5s 0.5s ease-in-out infinite;
  }

  /* Pill — bottom right */
  .ic-pill {
    width: 100px; bottom: 12%; right: 4%;
    opacity: 0.75;
    filter: drop-shadow(0 4px 12px rgba(0,50,85,0.15));
    animation: iconFloat 8s 2s ease-in-out infinite;
  }

  /* Heart pulse — top left */
  .ic-pulse {
    width: 120px; top: 8%; left: 5%;
    opacity: 0.65;
    filter: drop-shadow(0 4px 12px rgba(0,50,85,0.12));
    animation: iconFloat 7s 1.5s ease-in-out infinite;
  }

  /* Syringe — mid right */
  .ic-syringe {
    width: 100px; top: 52%; right: 3%;
    opacity: 0.65;
    filter: drop-shadow(0 4px 12px rgba(0,50,85,0.12));
    animation: iconFloat 6.5s 3s ease-in-out infinite;
  }

  /* Capsule — bottom center */
  .ic-capsule {
    width: 80px; bottom: 4%; left: 32%;
    opacity: 0.65;
    filter: drop-shadow(0 4px 10px rgba(0,50,85,0.12));
    animation: iconFloat 9s 0.8s ease-in-out infinite;
  }

  /* Small cross top center */
  .ic-cross2 {
    width: 50px; top: 4%; left: 40%;
    opacity: 0.55;
    filter: drop-shadow(0 3px 8px rgba(0,50,85,0.1));
    animation: iconFloat 5.5s 2.5s ease-in-out infinite;
  }

  @keyframes iconFloat {
    0%,100% { transform: translateY(0px) rotate(0deg); }
    50%      { transform: translateY(-16px) rotate(4deg); }
  }

  /* ── CARD ── */
  .card {
    position: relative;
    z-index: 1;
    width: 560px;
    max-width: 95vw;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border-radius: 32px;
    padding: 48px 50px 42px;
    box-shadow:
      0 2px 0px rgba(255,255,255,0.8) inset,
      0 24px 64px rgba(0, 50, 85, 0.17),
      0 4px 20px rgba(14,165,233,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeUp 0.7s cubic-bezier(.22,.9,.36,1) both;
    border: 1px solid rgba(255,255,255,0.7);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(32px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }

  /* Top decorative bar */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 60%; height: 4px;
    background: linear-gradient(90deg, var(--blue2), var(--blue1));
    border-radius: 0 0 6px 6px;
  }

  /* Logo */
  .logo-box {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--blue2), var(--blue1));
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
    box-shadow: 0 6px 24px rgba(14,165,233,0.4);
    animation: popIn 0.55s 0.25s cubic-bezier(.34,1.56,.64,1) both;
    position: relative;
  }
  .logo-box::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 24px;
    border: 2px solid rgba(14,165,233,0.2);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* Subtitle pill */
  .subtitle-pill {
    background: linear-gradient(90deg, rgba(14,165,233,0.12), rgba(60,181,236,0.12));
    border: 1px solid rgba(14,165,233,0.2);
    border-radius: 50px;
    padding: 5px 16px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--blue1);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 10px;
    animation: fadeUp 0.5s 0.35s both;
  }

  h2 {
    font-size: 27px;
    font-weight: 900;
    color: var(--primary);
    margin-bottom: 26px;
    text-align: center;
    letter-spacing: -0.4px;
    animation: fadeUp 0.5s 0.4s both;
  }

  /* Stats row */
  .stats-row {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-bottom: 24px;
    animation: fadeUp 0.5s 0.45s both;
  }
  .stat-card {
    flex: 1;
    background: linear-gradient(135deg, rgba(14,165,233,0.08), rgba(60,181,236,0.08));
    border: 1px solid rgba(14,165,233,0.15);
    border-radius: 16px;
    padding: 12px 10px;
    text-align: center;
  }
  .stat-card .stat-icon { font-size: 20px; margin-bottom: 3px; }
  .stat-card .stat-num {
    font-size: 16px; font-weight: 800;
    color: var(--primary); display: block;
  }
  .stat-card .stat-lbl {
    font-size: 10px; font-weight: 600;
    color: #6fa3bc; text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Divider */
  .divider {
    width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(14,165,233,0.2), transparent);
    margin-bottom: 22px;
    animation: fadeUp 0.5s 0.48s both;
  }

  /* Fields */
  .field {
    width: 100%; margin-bottom: 16px;
    animation: fadeUp 0.5s 0.5s both;
  }
  .field:nth-child(2) { animation-delay: 0.52s; }

  .field label {
    display: block; font-size: 12.5px; font-weight: 700;
    color: #4a7a9b; margin-bottom: 6px; letter-spacing: 0.3px;
  }
  .input-wrap { position: relative; }
  .input-wrap .ic {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    color: var(--blue2); width: 17px; height: 17px;
  }
  .field input {
    width: 100%; padding: 13px 18px 13px 44px;
    border: 1.5px solid var(--blue3);
    border-radius: 50px;
    font-size: 14px; font-family: 'Nunito', sans-serif;
    color: var(--primary); background: rgba(255,255,255,0.92);
    outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .field input::placeholder { color: #a8c8dc; }
  .field input:focus {
    border-color: var(--blue1);
    box-shadow: 0 0 0 3px rgba(14,165,233,0.13);
    background: #fff;
  }

  /* Forgot */
  .forgot {
    width: 100%; text-align: right; margin-top: -6px; margin-bottom: 20px;
    animation: fadeUp 0.5s 0.56s both;
  }
  .forgot a { font-size: 12.5px; color: var(--blue1); text-decoration: none; font-weight: 600; }

  /* Button */
  .btn-login {
    width: 100%; padding: 15px;
    background: linear-gradient(90deg, var(--blue1), #0284c7);
    border: none; border-radius: 50px;
    font-size: 16px; font-weight: 800;
    font-family: 'Nunito', sans-serif;
    color: #fff; cursor: pointer; letter-spacing: 0.6px;
    box-shadow: 0 6px 22px rgba(14,165,233,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    margin-bottom: 18px;
    position: relative; overflow: hidden;
    animation: fadeUp 0.5s 0.6s both;
  }
  .btn-login::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transform: skewX(-20deg);
    transition: left 0.5s;
  }
  .btn-login:hover::after { left: 160%; }
  .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(14,165,233,0.48); }
  .btn-login:active { transform: translateY(0); }

  /* Trust badges row */
  .trust-row {
    display: flex; gap: 12px; width: 100%;
    margin-bottom: 18px;
    animation: fadeUp 0.5s 0.64s both;
  }
  .trust-badge {
    flex: 1; display: flex; align-items: center; gap: 6px;
    background: rgba(14,165,233,0.07);
    border: 1px solid rgba(14,165,233,0.14);
    border-radius: 10px; padding: 7px 10px;
    font-size: 11px; font-weight: 700; color: #4a8aaa;
  }
  .trust-badge svg { width: 14px; height: 14px; color: var(--blue1); flex-shrink: 0; }

  /* Signup */
  .signup-txt {
    font-size: 13px; color: #7aa0b3; text-align: center;
    animation: fadeUp 0.5s 0.68s both;
  }
  .signup-txt a { color: var(--blue1); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

<!-- Bubbles -->
<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>
<div class="bubble b4"></div>
<div class="bubble b5"></div>
<div class="bubble b6"></div>
<div class="bubble b7"></div>

<!-- Floating Medical Icons -->

<!-- Stethoscope -->
<svg class="icon-float ic-steth" viewBox="0 0 100 110" fill="none">
  <circle cx="72" cy="80" r="14" stroke="#6C3FC5" stroke-width="6" fill="none"/>
  <circle cx="72" cy="80" r="6"  fill="#6C3FC5"/>
  <path d="M22 14 C22 14 16 38 16 52 C16 68 30 78 46 78 C62 78 72 68 72 58" stroke="#6C3FC5" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="22" cy="14" r="7" fill="#6C3FC5"/>
  <circle cx="44" cy="14" r="7" fill="#6C3FC5"/>
  <line x1="22" y1="14" x2="22" y2="28" stroke="#6C3FC5" stroke-width="6" stroke-linecap="round"/>
  <line x1="44" y1="14" x2="44" y2="28" stroke="#6C3FC5" stroke-width="6" stroke-linecap="round"/>
  <path d="M22 28 Q33 40 44 28" stroke="#6C3FC5" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>

<!-- Big Colorful Clipboard (matches reference image) -->
<svg class="icon-float ic-clip" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <rect x="30" y="32" width="156" height="200" rx="18" fill="rgba(0,50,85,0.13)" transform="translate(7,9)"/>
  <!-- White body -->
  <rect x="22" y="22" width="156" height="200" rx="18" fill="white"/>
  <!-- Purple clip -->
  <rect x="76" y="6"  width="48" height="30" rx="10" fill="#6C3FC5"/>
  <rect x="86" y="12" width="28" height="18" rx="6"  fill="#5530A8"/>
  <!-- Teal lines -->
  <line x1="44" y1="68"  x2="158" y2="68"  stroke="#2ABFA3" stroke-width="6" stroke-linecap="round"/>
  <line x1="44" y1="90"  x2="158" y2="90"  stroke="#2ABFA3" stroke-width="6" stroke-linecap="round"/>
  <line x1="44" y1="112" x2="128" y2="112" stroke="#2ABFA3" stroke-width="6" stroke-linecap="round"/>
  <line x1="44" y1="134" x2="158" y2="134" stroke="#2ABFA3" stroke-width="6" stroke-linecap="round"/>
  <!-- Light separator -->
  <line x1="44" y1="153" x2="158" y2="153" stroke="#CBE9FF" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Teal cross -->
  <rect x="44"  y="166" width="38" height="13" rx="6.5" fill="#2ABFA3"/>
  <rect x="57"  y="153" width="13" height="38" rx="6.5" fill="#2ABFA3"/>
  <!-- Purple stethoscope -->
  <path d="M118 160 C118 160 115 180 115 188 C115 200 125 207 135 207 C145 207 152 199 152 191" stroke="#6C3FC5" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <circle cx="152" cy="188" r="9.5" stroke="#6C3FC5" stroke-width="4.5" fill="none"/>
  <circle cx="152" cy="188" r="4.5" fill="#6C3FC5"/>
  <circle cx="118" cy="159" r="5.5" fill="#6C3FC5"/>
  <circle cx="129" cy="159" r="5.5" fill="#6C3FC5"/>
  <line x1="118" y1="159" x2="118" y2="167" stroke="#6C3FC5" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="129" y1="159" x2="129" y2="167" stroke="#6C3FC5" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M118 167 Q123.5 174 129 167" stroke="#6C3FC5" stroke-width="4.5" fill="none" stroke-linecap="round"/>
</svg>

<!-- Cross big -->
<svg class="icon-float ic-cross" viewBox="0 0 64 64" fill="none">
  <rect x="22" y="4"  width="20" height="56" rx="9" fill="#2ABFA3"/>
  <rect x="4"  y="22" width="56" height="20" rx="9" fill="#2ABFA3"/>
</svg>

<!-- Pill -->
<svg class="icon-float ic-pill" viewBox="0 0 90 40" fill="none">
  <rect x="2" y="2" width="86" height="36" rx="18" fill="#FFBA90"/>
  <rect x="2" y="2" width="43" height="36" rx="18" fill="#FF9A6C"/>
  <line x1="45" y1="2" x2="45" y2="38" stroke="white" stroke-width="2.5" opacity="0.5"/>
</svg>

<!-- Heart pulse -->
<svg class="icon-float ic-pulse" viewBox="0 0 120 60" fill="none">
  <polyline points="0,30 20,30 30,10 40,50 50,20 60,40 70,30 120,30" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

<!-- Syringe -->
<svg class="icon-float ic-syringe" viewBox="0 0 100 36" fill="none">
  <rect x="20" y="10" width="60" height="16" rx="8" fill="#3CB5EC"/>
  <rect x="22" y="12" width="30" height="12" rx="6" fill="white" opacity="0.45"/>
  <line x1="37" y1="12" x2="37" y2="24" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="47" y1="12" x2="47" y2="24" stroke="white" stroke-width="2" opacity="0.5"/>
  <rect x="78" y="15" width="18" height="6" rx="3" fill="#0EA5E9"/>
  <polygon points="96,12 100,18 96,24" fill="#0EA5E9"/>
  <rect x="10" y="13" width="12" height="10" rx="4" fill="#0EA5E9"/>
  <line x1="2" y1="10" x2="10" y2="14" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
  <line x1="2" y1="26" x2="10" y2="22" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
</svg>

<!-- Capsule -->
<svg class="icon-float ic-capsule" viewBox="0 0 70 30" fill="none">
  <rect x="2" y="2" width="66" height="26" rx="13" fill="#003255"/>
  <rect x="2" y="2" width="33" height="26" rx="13" fill="#0EA5E9" opacity="0.45"/>
</svg>

<!-- Small cross top -->
<svg class="icon-float ic-cross2" viewBox="0 0 44 44" fill="none">
  <rect x="16" y="2"  width="12" height="40" rx="6" fill="#003255"/>
  <rect x="2"  y="16" width="40" height="12" rx="6" fill="#003255"/>
</svg>

<!-- ── CARD ── -->
<div class="card">

  <div class="logo-box">
    <svg width="38" height="38" viewBox="0 0 40 40" fill="none">
      <circle cx="28" cy="28" r="5" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M10 8 C10 8 8 16 8 20 C8 26 13 30 19 30 C25 30 28 26 28 23"
            stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <circle cx="10" cy="8" r="2.5" fill="white"/>
      <circle cx="18" cy="8" r="2.5" fill="white"/>
      <line x1="10" y1="8" x2="10" y2="14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="18" y1="8" x2="18" y2="14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M10 14 Q14 18 18 14" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="subtitle-pill">🏥 Espace Médical</div>

  <h2>Welcome Back Doctor !</h2>


  <div class="field">
    <label>Nom d'utilisateur</label>
    <div class="input-wrap">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <input type="text" placeholder="doctor_name@cabinet.dz" />
    </div>
  </div>

  <div class="field">
    <label>Mot de passe</label>
    <div class="input-wrap">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input type="password" placeholder="••••••••" />
    </div>
  </div>

  <div class="forgot"><a href="#">Mot de passe oublié ?</a></div>

  <button class="btn-login">Connexion</button>

  <!-- Trust badges -->
  <div class="trust-row">
    <div class="trust-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Sécurisé
    </div>
    <div class="trust-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      Certifié
    </div>
    <div class="trust-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Chiffré
    </div>
  </div>

  <p class="signup-txt">Vous n'avez pas de compte ? <a href="#">Inscrivez vous</a></p>
</div>

</body>
</html>
